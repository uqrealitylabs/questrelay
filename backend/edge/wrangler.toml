name = "questrelay"
account_id = "ca120265a1ff5ecd9af28d2cf18e4789"
main = "build/index.js"
compatibility_date = "2026-09-30"
workers_dev = false
routes = [{ pattern = "cast.uqrealitylabs.com", custom_domain = true }]

[triggers]
crons = ["0 4 * * *"]

[build]
command = "worker-build --release"

[assets]
directory = "../../frontend/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/health"]

[[d1_databases]]
binding = "DB"
database_name = "questrelay-edge"
database_id = "a3efd7db-3996-47e5-9a6e-83b85f676ae6"

[vars]
SFU_APP_ID = "18f605d23a21ff65b640aca4f8bae12d"
