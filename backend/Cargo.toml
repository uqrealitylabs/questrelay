[package]
name = "questrelay-backend"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["ws"] }
mediasoup = "0.28.1"
parking_lot = "0.12"
rand = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
subtle = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
webauthn-rs = "0.5.5"
