name: Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.paths.outputs.web }}
      backend: ${{ steps.paths.outputs.backend }}
      edge: ${{ steps.paths.outputs.edge }}
      quest: ${{ steps.paths.outputs.quest }}
      deploy: ${{ steps.paths.outputs.deploy }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: paths
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
        run: tools/scripts/changes.sh >> "$GITHUB_OUTPUT"

  web:
    needs: detect
    if: needs.detect.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npx biome lint .
      - run: npm run build -w @questrelay/shared
      - run: npm run test -w @questrelay/shared
      - run: npm run test -w @questrelay/prototype
      - run: npm run test -w @questrelay/web
      - run: npm run build -w @questrelay/web

  deploy:
    needs: detect
    if: needs.detect.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          shellcheck tools/scripts/*.sh
          bash tools/scripts/changes.test.sh
          cp tools/config/.env.example .env
          docker compose -f tools/config/compose.yaml --project-directory . config --quiet

  backend:
    needs: detect
    if: needs.detect.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang cmake ninja-build pkg-config python3 python3-pip python3-venv
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            backend/target
          key: backend-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('backend/Cargo.lock') }}
          restore-keys: backend-${{ runner.os }}-${{ runner.arch }}-
      - run: cargo fmt --manifest-path backend/Cargo.toml -- --check
      - run: cargo test --manifest-path backend/Cargo.toml --locked
      - run: cargo clippy --manifest-path backend/Cargo.toml --locked -- -D warnings

  edge:
    needs: detect
    if: needs.detect.outputs.edge == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            backend/edge/target
          key: edge-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('backend/edge/Cargo.lock') }}
          restore-keys: edge-${{ runner.os }}-${{ runner.arch }}-
      - run: cargo fmt --manifest-path backend/edge/Cargo.toml -- --check
      - run: cargo clippy --manifest-path backend/edge/Cargo.toml --locked --target wasm32-unknown-unknown -- -D warnings
      - run: cargo test --manifest-path backend/edge/Cargo.toml --locked
      - id: worker-cache
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/worker-build
          key: worker-build-0.8.7-${{ runner.os }}-${{ runner.arch }}
      - if: steps.worker-cache.outputs.cache-hit != 'true'
        run: cargo install worker-build --version 0.8.7 --locked
      - run: worker-build --release
        working-directory: backend/edge

  quest:
    needs: detect
    if: needs.detect.outputs.quest == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-go@v6
        with:
          go-version-file: quest/transport/go.mod
          cache-dependency-path: quest/transport/go.sum
      - uses: android-actions/setup-android@v4
      - run: sdkmanager 'platforms;android-35' 'build-tools;36.0.0' 'ndk;27.2.12479018'
      - run: go test ./...
        working-directory: quest/transport
      - run: ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018" bash tools/scripts/build-transport.sh
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.0'
          cache-provider: basic
      - run: gradle -p quest/app :app:testDebugUnitTest :app:assembleDebug --no-daemon
      - if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v7
        with:
          name: questrelay-quest-debug
          path: quest/app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
